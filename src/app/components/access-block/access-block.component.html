<section data-testid="access-block" class="access-block" role="alert" aria-labelledby="access-block-title">
  <p class="eyebrow">Seguridad de la instalación</p>
  <h1 id="access-block-title">Acceso bloqueado</h1>
  <p data-testid="access-status" class="access-status">Estado: {{ statusLabel }}</p>

  <p *ngIf="accessState().label" data-testid="access-label">Dispositivo: {{ accessState().label }}</p>

  <div *ngIf="canCopyUid" class="access-actions">
    <button data-testid="copy-uid" type="button" (click)="copyUid()">Copiar UID</button>
  </div>

  <p data-testid="access-instructions" class="access-instructions">{{ instructions }}</p>
  <p *ngIf="copyMessage" data-testid="copy-status" role="status" aria-live="polite">{{ copyMessage }}</p>
</section>
